name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Android SDK platform 35 and build APK
        run: |
          docker run --rm \\
            --entrypoint /bin/bash \\
            -v "${{ github.workspace }}:/root/src" \\
            -w /root/src \\
            notfl3/cargo-apk:latest \\
            -lc '
              set -eux
              export ANDROID_HOME=/opt/android-sdk-linux
              export ANDROID_SDK_ROOT="$ANDROID_HOME"

              SDKMANAGER="$(find "$ANDROID_HOME" /opt -type f -name sdkmanager 2>/dev/null | head -n 1)"
              if [ -z "$SDKMANAGER" ]; then
                echo "sdkmanager was not found in the cargo-apk image."
                exit 1
              fi

              yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
              "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

              test -f "$ANDROID_HOME/platforms/android-35/android.jar"
              cargo quad-apk build --release
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arcane-frontier-android-apk
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
